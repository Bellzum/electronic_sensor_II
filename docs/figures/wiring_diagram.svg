<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">
  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">RFID Door Access — Wiring Diagram (Arduino Uno)</text>

  <!-- Arduino -->
  <rect x="380" y="140" width="240" height="360" rx="12" fill="#0b6e8a" stroke="#064b5e" stroke-width="3"/>
  <text x="500" y="350" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">Arduino Uno</text>
  <g font-size="13" fill="#fff">
    <text x="390" y="180">D13 (SCK)</text>
    <text x="390" y="210">D12 (MISO)</text>
    <text x="390" y="240">D11 (MOSI)</text>
    <text x="390" y="270">D10 (SS)</text>
    <text x="390" y="300">D9 (RST)</text>
    <text x="390" y="390">3.3V</text>
    <text x="390" y="430">GND</text>
    <text x="610" y="180" text-anchor="end">5V</text>
    <text x="610" y="210" text-anchor="end">GND</text>
    <text x="610" y="240" text-anchor="end">A4 (SDA)</text>
    <text x="610" y="270" text-anchor="end">A5 (SCL)</text>
    <text x="610" y="390" text-anchor="end">D3 (PWM)</text>
    <text x="610" y="430" text-anchor="end">5V</text>
    <text x="610" y="470" text-anchor="end">GND</text>
  </g>

  <!-- RC522 -->
  <rect x="40" y="140" width="190" height="320" rx="10" fill="#1f4fa3" stroke="#12306a" stroke-width="3"/>
  <text x="135" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">RFID RC522 (3.3V only!)</text>
  <g font-size="13" fill="#fff" text-anchor="end">
    <text x="222" y="180">SCK</text><text x="222" y="210">MISO</text><text x="222" y="240">MOSI</text>
    <text x="222" y="270">SDA/SS</text><text x="222" y="300">RST</text><text x="222" y="340">IRQ (n/c)</text>
    <text x="222" y="390">3.3V</text><text x="222" y="430">GND</text>
  </g>
  <g stroke-width="3" fill="none">
    <line x1="230" y1="176" x2="380" y2="176" stroke="#f39c12"/>
    <line x1="230" y1="206" x2="380" y2="206" stroke="#8e44ad"/>
    <line x1="230" y1="236" x2="380" y2="236" stroke="#27ae60"/>
    <line x1="230" y1="266" x2="380" y2="266" stroke="#2980b9"/>
    <line x1="230" y1="296" x2="380" y2="296" stroke="#7f8c8d"/>
    <line x1="230" y1="386" x2="380" y2="386" stroke="#e74c3c"/>
    <line x1="230" y1="426" x2="380" y2="426" stroke="#000"/>
  </g>

  <!-- LCD -->
  <rect x="770" y="140" width="200" height="150" rx="10" fill="#2e7d32" stroke="#1b4d1f" stroke-width="3"/>
  <rect x="790" y="160" width="160" height="50" fill="#a5d6a7"/>
  <text x="870" y="190" text-anchor="middle" font-size="13" fill="#1b4d1f">Door LOCKED</text>
  <text x="870" y="125" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">LCD 16x2 + I²C (0x27)</text>
  <g font-size="13" fill="#fff"><text x="778" y="234">VCC</text><text x="778" y="254">GND</text><text x="778" y="274">SDA</text><text x="850" y="274">SCL</text></g>
  <g stroke-width="3" fill="none">
    <polyline points="620,176 700,176 700,230 770,230" stroke="#e74c3c"/>
    <polyline points="620,206 690,206 690,250 770,250" stroke="#000"/>
    <polyline points="620,236 680,236 680,270 770,270" stroke="#2980b9"/>
    <polyline points="620,266 670,266 670,300 880,300 880,290" stroke="#f1c40f"/>
  </g>

  <!-- Servo -->
  <rect x="770" y="370" width="200" height="110" rx="10" fill="#34495e" stroke="#1c2833" stroke-width="3"/>
  <circle cx="930" cy="425" r="22" fill="#ecf0f1"/><rect x="926" y="395" width="8" height="30" fill="#bdc3c7"/>
  <text x="870" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">Servo SG90 (lock)</text>
  <g font-size="13" fill="#fff"><text x="778" y="394">Signal (orange)</text><text x="778" y="434">VCC (red)</text><text x="778" y="474">GND (brown)</text></g>
  <g stroke-width="3" fill="none">
    <line x1="620" y1="386" x2="770" y2="390" stroke="#e67e22"/>
    <line x1="620" y1="426" x2="770" y2="430" stroke="#e74c3c"/>
    <line x1="620" y1="466" x2="770" y2="470" stroke="#8b4513"/>
  </g>

  <!-- Legend -->
  <g font-size="13" fill="#222">
    <text x="40" y="540" font-weight="bold">Notes</text>
    <text x="40" y="562">• RC522 power = 3.3V (5V can damage it). All GNDs are connected together (common ground).</text>
    <text x="40" y="582">• Red = power, black/brown = ground. If the Arduino resets when the servo moves, power the servo from an external 5V (share GND).</text>
    <text x="40" y="602">• If the LCD stays blank: adjust the blue contrast screw, or change the I²C address to 0x3F in the code.</text>
  </g>
</svg>
