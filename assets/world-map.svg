    <rect x="30" y="420" width="300" height="230" fill="#e9e4d2" stroke="#c9c1a6" stroke-width="3" rx="4"/>
    <text x="48" y="448" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="20" fill="#174638">2 · Lights &amp; Security</text>
    <text x="48" y="468" font-size="12" fill="#4b5a52">light sensor · motion sensor · siren</text>
    <g>
      <rect x="70" y="510" width="6" height="110" fill="#3a3f3c"/><circle cx="73" cy="506" r="12" fill="#ffd36b"/><circle cx="73" cy="506" r="26" fill="#ffd36b" opacity=".25"/>
      <rect x="140" y="510" width="6" height="110" fill="#3a3f3c"/><circle cx="143" cy="506" r="12" fill="#ffd36b"/><circle cx="143" cy="506" r="26" fill="#ffd36b" opacity=".25"/>
    </g>
    <circle cx="220" cy="540" r="18" fill="#f3f1e4" stroke="#3a3f3c" stroke-width="3"/><text x="203" y="575" font-size="10" fill="#174638">PIR</text>
    <path d="M272 520 l22 -14 v52 l-22 -14 z" fill="#ff6b5a"/><rect x="258" y="520" width="14" height="24" fill="#ff6b5a"/>
