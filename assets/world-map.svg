    <rect x="720" y="228" width="120" height="12" fill="#7a5a36"/>
    <g transform="translate(910 150)"><circle r="26" fill="#f3f1e4" stroke="#3a3f3c" stroke-width="3"/>
      <path d="M0 0 L0 -20 A20 20 0 0 1 17 -10 Z M0 0 L17 10 A20 20 0 0 1 0 20 Z M0 0 L-17 10 A20 20 0 0 1 -17 -10 Z" fill="#7ab8ff"/></g>
    <text x="893" y="194" font-size="10" fill="#174638">fan</text>
    <path d="M900 212 q0 -14 10 -24 q10 10 10 24 a10 10 0 0 1 -20 0z" fill="#7ab8ff"/><text x="926" y="222" font-size="10" fill="#174638">pump</text>
    <rect x="862" y="232" width="10" height="26" fill="#2f6fd0"/><text x="876" y="252" font-size="10" fill="#174638">soil</text>

    <!-- ZONE 5 ROVER on road -->
    <g transform="translate(330 312)">
      <rect x="0" y="0" width="70" height="44" rx="6" fill="#ffd36b" stroke="#174638" stroke-width="3"/>
      <rect x="-8" y="-6" width="16" height="14" rx="2" fill="#174638"/><rect x="-8" y="36" width="16" height="14" rx="2" fill="#174638"/>
      <rect x="54" y="-6" width="16" height="14" rx="2" fill="#174638"/><rect x="54" y="36" width="16" height="14" rx="2" fill="#174638"/>
      <rect x="66" y="14" width="10" height="16" fill="#2f6fd0"/>
      <rect x="18" y="12" width="24" height="18" rx="2" fill="#f3f1e4"/>
    </g>
    <text x="300" y="400" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="18" fill="#f3f1e4">5 · Delivery Rover</text>
    <text x="300" y="418" font-size="12" fill="#b9d3c6">motors · IMU · obstacle stop · RFID tag</text>

    <!-- FINAL DOG on road -->
    <g transform="translate(600 300)">
      <rect x="10" y="12" width="70" height="30" rx="10" fill="#f3f1e4" stroke="#174638" stroke-width="3"/>
      <rect x="74" y="0" width="28" height="24" rx="6" fill="#f3f1e4" stroke="#174638" stroke-width="3"/>
      <circle cx="94" cy="11" r="4" fill="#2f6fd0"/>
      <g stroke="#174638" stroke-width="5" stroke-linecap="round"><path d="M20 42 l-6 22"/><path d="M36 42 l4 22"/><path d="M60 42 l-4 22"/><path d="M74 42 l6 22"/></g>
      <rect x="76" y="24" width="18" height="6" fill="#ffd36b"/>
    </g>
    <text x="580" y="400" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="18" fill="#ffd36b">★ Robot Dog Patrol</text>
    <text x="580" y="418" font-size="12" fill="#b9d3c6">Freenove dog · collar tag opens the gate</text>

    <!-- ZONE 6 CONTROL CENTER -->
    <rect x="670" y="440" width="300" height="210" fill="#e9e4d2" stroke="#c9c1a6" stroke-width="3" rx="4"/>
    <text x="688" y="468" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="20" fill="#174638">3+6 · Control Center</text>
