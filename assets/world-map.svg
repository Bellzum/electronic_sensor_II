    <!-- ROAD -->
    <rect x="20" y="290" width="960" height="90" fill="#3a3f3c"/>
    <line x1="20" y1="335" x2="980" y2="335" stroke="#e9e4d2" stroke-width="3" stroke-dasharray="22 18"/>
    <text x="34" y="306" fill="#b9d3c6" font-size="12" font-family="IBM Plex Mono, monospace">ROAD · gate → farm</text>

    <!-- ZONE 1 GATE -->
    <rect x="30" y="30" width="300" height="230" fill="#e9e4d2" stroke="#c9c1a6" stroke-width="3" rx="4"/>
    <text x="48" y="58" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="20" fill="#174638">1 · Smart Gate</text>
    <text x="48" y="78" font-size="12" fill="#4b5a52">RFID · servo lock · reed switch · buzzer</text>
    <!-- fence -->
    <g fill="#8a7a55"><rect x="48" y="200" width="90" height="10"/><rect x="220" y="200" width="92" height="10"/>
      <rect x="54" y="170" width="8" height="40"/><rect x="84" y="170" width="8" height="40"/><rect x="114" y="170" width="8" height="40"/>
      <rect x="230" y="170" width="8" height="40"/><rect x="260" y="170" width="8" height="40"/><rect x="290" y="170" width="8" height="40"/></g>
    <!-- door ajar -->
    <rect x="140" y="140" width="78" height="72" fill="#b98b52" stroke="#6b4d2a" stroke-width="3"/>
    <circle cx="206" cy="178" r="4" fill="#3a3f3c"/>
    <!-- servo -->
    <rect x="148" y="150" width="22" height="14" fill="#2f6fd0"/><text x="150" y="146" font-size="10" fill="#174638">servo</text>
