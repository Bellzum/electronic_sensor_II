    <rect x="690" y="505" width="70" height="48" rx="4" fill="#3d8a4f"/><g fill="#ffd36b"><rect x="698" y="513" width="14" height="10"/><rect x="738" y="513" width="14" height="10"/></g>
    <text x="702" y="546" font-size="11" fill="#f3f1e4" font-family="IBM Plex Mono, monospace">Pi hub</text>
    <rect x="776" y="502" width="120" height="78" rx="4" fill="#174638"/>
    <polyline points="784,566 800,552 816,560 832,536 848,544 864,524 886,532" fill="none" stroke="#7ee08a" stroke-width="2.5"/>
    <text x="784" y="518" font-size="10" fill="#b9d3c6" font-family="IBM Plex Mono, monospace">dashboard</text>
    <rect x="690" y="566" width="74" height="54" rx="4" fill="#3a3f3c"/><text x="696" y="586" font-size="10" fill="#7ab8ff" font-family="IBM Plex Mono, monospace">Gazebo</text><text x="696" y="600" font-size="10" fill="#7ab8ff" font-family="IBM Plex Mono, monospace">twin</text>
    <rect x="776" y="592" width="70" height="40" rx="3" fill="#f3f1e4" stroke="#3a3f3c" stroke-width="2"/>
    <g stroke="#3a3f3c" stroke-width="2"><line x1="784" y1="604" x2="838" y2="604"/><line x1="784" y1="614" x2="838" y2="614"/><line x1="784" y1="624" x2="820" y2="624"/></g>
    <text x="780" y="645" font-size="10" fill="#174638">CSV log</text>
    <circle cx="930" cy="610" r="22" fill="#ff6b5a" stroke="#174638" stroke-width="4"/><text x="903" y="648" font-size="10" fill="#174638">world E-stop</text>

    <!-- link label -->
    <text x="430" y="610" font-size="12" fill="#ffd36b" font-family="IBM Plex Mono, monospace">- - - Wi‑Fi / MQTT: world/*</text>
  </svg>