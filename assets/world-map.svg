    <text x="424" y="78" font-size="12" fill="#4b5a52">pan/tilt camera · vision</text>
    <path d="M478 214 L492 110 L508 110 L522 214 Z" fill="#8a7a55"/>
    <rect x="482" y="92" width="36" height="22" rx="3" fill="#3a3f3c"/><circle cx="500" cy="103" r="7" fill="#7ab8ff"/>
    <path d="M482 103 L400 175 L380 120 Z" fill="#ffd36b" opacity=".35"/>
    <text x="530" y="140" font-size="10" fill="#174638">aims at</text><text x="530" y="152" font-size="10" fill="#174638">GATE · FARM</text><text x="530" y="164" font-size="10" fill="#174638">· ROAD</text>

    <!-- ZONE 3 FARM -->
    <rect x="670" y="30" width="300" height="240" fill="#e9e4d2" stroke="#c9c1a6" stroke-width="3" rx="4"/>
