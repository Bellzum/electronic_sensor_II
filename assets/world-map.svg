<svg width="1000" height="680" viewBox="0 0 1000 680" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#24594a" stroke-width="1"/></pattern>
    </defs>
    <rect x="0" y="0" width="1000" height="680" fill="url(#g)"/>

    <!-- Wi-Fi / MQTT links to control center -->
    <g stroke="#ffd36b" stroke-width="2" stroke-dasharray="6 7" fill="none" opacity=".85">
      <path d="M190 225 C 300 470, 560 540, 700 560"/>
      <path d="M260 540 C 420 600, 560 600, 700 585"/>
      <path d="M500 205 C 520 380, 640 470, 720 520"/>
      <path d="M830 265 C 840 360, 830 420, 820 450"/>
      <path d="M330 345 C 480 420, 620 470, 700 530"/>
      <path d="M620 330 C 680 400, 720 440, 760 460"/>
