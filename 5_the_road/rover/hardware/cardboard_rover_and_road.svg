<rect x="170" y="338" width="22" height="4" fill="#fff" stroke="#888" stroke-width="0.3"/>
<rect x="210" y="338" width="22" height="4" fill="#fff" stroke="#888" stroke-width="0.3"/>
<rect x="250" y="338" width="22" height="4" fill="#fff" stroke="#888" stroke-width="0.3"/>
<rect x="0" y="370" width="300" height="4" fill="none" stroke="#888" stroke-width="0.5" stroke-dasharray="1.5 1.5"/>
<text x="150.0" y="374.0" text-anchor="middle" font-size="4.5" fill="#888"></text>
<text x="150" y="385" text-anchor="middle" font-size="4.5" fill="#555">optional: black tape line at y = 50 for line following</text>
<rect x="260" y="310" width="30" height="60" fill="#fff" stroke="#c0392b" stroke-width="0.8"/>
<text x="275.0" y="376" text-anchor="middle" font-size="4.5" fill="#555">GATE STOP LINE tile only: white bar</text>
</svg>
