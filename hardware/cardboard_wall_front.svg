<svg xmlns="http://www.w3.org/2000/svg" width="440mm" height="340mm" viewBox="-20 -40 440 340" font-family="Helvetica, Arial, sans-serif">
  <rect x="-20" y="-40" width="440" height="340" fill="#fff"/>
  <text x="200" y="-20" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Cardboard Demo Wall — FRONT view (1:1 scale, mm)</text>
  <text x="200" y="-8" text-anchor="middle" font-size="6" fill="#555">Print at 100% (A3 landscape) or measure with a ruler. Red = CUT, blue dashed = SCORE/FOLD, grey = mark only.</text>

  <!-- Wall outline -->
  <rect x="0" y="0" width="400" height="280" fill="#f5e6c8" stroke="#c0392b" stroke-width="0.8"/>

  <!-- DOOR: cut on 3 sides, hinge on left -->
  <polyline points="40,60 150,60 150,250 40,250" fill="#e8d3a8" stroke="#c0392b" stroke-width="0.8"/>
  <line x1="40" y1="60" x2="40" y2="250" stroke="#2471a3" stroke-width="0.8" stroke-dasharray="4 2"/>
  <text x="95" y="150" text-anchor="middle" font-size="9" fill="#7b5b2a" font-weight="bold">DOOR</text>
  <text x="95" y="162" text-anchor="middle" font-size="6" fill="#7b5b2a">110 x 190, opens OUTWARD</text>
  <text x="95" y="230" text-anchor="middle" font-size="5" fill="#2471a3">◄ HINGE (left): score line + tape inside</text>
  <circle cx="135" cy="100" r="6" fill="#fff" stroke="#c0392b" stroke-width="0.8"/>
  <text x="135" y="114" text-anchor="middle" font-size="5" fill="#555">pull hole Ø12</text>

  <!-- SERVO cutout (SG90 body 12.5 x 23, vertical, shaft near top) -->
  <rect x="158.75" y="149" width="12.5" height="23" fill="#fff" stroke="#c0392b" stroke-width="0.8"/>
  <rect x="158.75" y="144" width="12.5" height="33" fill="none" stroke="#999" stroke-width="0.4" stroke-dasharray="1.5 1"/>
  <circle cx="165" cy="155" r="2.2" fill="#2c3e50"/>
  <!-- lock arm positions -->
  <line x1="165" y1="155" x2="127" y2="155" stroke="#c0392b" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  <line x1="165" y1="155" x2="165" y2="117" stroke="#27ae60" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
  
  
  <text x="178" y="152" font-size="5" fill="#555">SG90 cutout 12.5 x 23</text><text x="178" y="158" font-size="5" fill="#555">tabs rest on front, glue/tape</text><text x="178" y="164" font-size="5" fill="#555">arm = 38 mm stick on horn</text>

  <!-- LCD window 66 x 17, board behind -->
  <rect x="257" y="40" width="66" height="17" fill="#fff" stroke="#c0392b" stroke-width="0.8"/>
  <text x="290" y="35" text-anchor="middle" font-size="6" fill="#222">LCD window 66 x 17</text>
  <g fill="#fff" stroke="#999" stroke-width="0.5">
    <circle cx="252.5" cy="33" r="1.6"/><circle cx="327.5" cy="33" r="1.6"/>
    <circle cx="252.5" cy="64" r="1.6"/><circle cx="327.5" cy="64" r="1.6"/>
  </g>
  <text x="290" y="74" text-anchor="middle" font-size="5" fill="#555">LCD board (80 x 36) sits BEHIND; holes approx, check yours</text>

  <!-- RFID zone -->
  <rect x="260" y="100" width="60" height="80" rx="6" fill="none" stroke="#8e44ad" stroke-width="1" stroke-dasharray="3 1.5"/>
  <text x="290" y="132" text-anchor="middle" font-size="8" font-weight="bold" fill="#8e44ad">TAP CARD</text>
  <text x="290" y="142" text-anchor="middle" font-size="8" font-weight="bold" fill="#8e44ad">HERE</text>
  <rect x="270" y="110" width="40" height="60" fill="none" stroke="#999" stroke-width="0.4" stroke-dasharray="1.5 1"/>
  <text x="290" y="192" text-anchor="middle" font-size="5" fill="#555">RC522 (40 x 60) taped BEHIND, antenna facing wall</text>
  <text x="290" y="198" text-anchor="middle" font-size="5" fill="#555">keep single cardboard layer here, no metal</text>

  <!-- Status text area -->
  <rect x="255" y="215" width="130" height="30" fill="none" stroke="#999" stroke-width="0.5" stroke-dasharray="2 1"/>
  <text x="320" y="234" text-anchor="middle" font-size="8" fill="#555">RFID DOOR · DEMO</text>

  <g font-size="5">
    <line x1="156" y1="222" x2="170" y2="222" stroke="#c0392b" stroke-width="4" stroke-linecap="round" opacity="0.55"/><text x="174" y="224" fill="#c0392b">LOCKED 0° (arm over door edge)</text>
    <line x1="156" y1="232" x2="170" y2="232" stroke="#27ae60" stroke-width="4" stroke-linecap="round" opacity="0.55"/><text x="174" y="234" fill="#27ae60">UNLOCKED 87° (arm points up)</text>
    <text x="156" y="244" fill="#555">Flip arm mount if it turns the wrong way.</text></g>
  <!-- Dimensions -->
  <g stroke="#555" stroke-width="0.4" fill="#555" font-size="5">
    <line x1="0" y1="290" x2="400" y2="290"/><text x="200" y="298" text-anchor="middle" stroke="none">400</text>
    <line x1="-12" y1="0" x2="-12" y2="280"/><text x="-14" y="140" text-anchor="end" stroke="none" transform="rotate(-90 -14 140)">280</text>
    </g>
  <!-- Back-side note -->
  <text x="0" y="-30" font-size="5" fill="#555">Origin (0,0) = top-left corner. Door x 40–150, y 60–250.</text>
</svg>
